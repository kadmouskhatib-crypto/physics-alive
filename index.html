<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Physics Alive: discover physics laws yourself. Experience, predict, experiment, measure, discover, understand, apply, remember.">
<title>Physics Alive</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="katex/katex.min.css">
<link rel="stylesheet" href="css/app.css">
<script>try{const t=localStorage.getItem('pa_theme');if(t)document.documentElement.dataset.theme=JSON.parse(t)}catch(e){}</script>
<script defer src="katex/katex.min.js"></script>
<script defer src="js/i18n.js"></script>
<script defer src="js/core.js"></script>
<script defer src="lessons/coulomb.js"></script>
<script defer src="lessons/flux.js"></script>
<script defer src="lessons/gauss.js"></script>
<script defer src="lessons/capacitor.js"></script>
<script defer src="lessons/rc.js"></script>
<script defer src="js/boot.js"></script>
</head>
<body>

<header class="top"><div class="wrap">
  <div class="brand"><i></i>Physics <span>Alive</span></div>
  <select class="ib crumb" id="lessonSel" aria-label="Lesson"></select>
  <div class="sp"></div>
  <nav class="modes" role="tablist" id="modesTop"></nav>
  <select class="ib" id="langSel" aria-label="Language"><option value="en">EN</option><option value="fr">FR</option><option value="ar">ع</option></select>
  <button class="ib" id="themeBtn" aria-label="Theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  <button class="ib" id="hlBtn" aria-label="Highlight"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l-6 6v3h3l6-6M22 5l-3-3-9 9 3 3z"/></svg></button>
</div></header>

<main>
  <div class="mode" id="m-learn"></div>
  <div class="mode" id="m-textbook"></div>
  <div class="mode" id="m-practice"></div>
  <div class="mode" id="m-notebook"></div>
</main>

<nav class="bottomnav modes" role="tablist" id="modesBottom"></nav>

<div id="hlBar">
  <button class="sw sel" data-c="y" style="background:var(--hl-y)" aria-label="yellow"></button>
  <button class="sw" data-c="g" style="background:var(--hl-g)" aria-label="green"></button>
  <button class="sw" data-c="p" style="background:var(--hl-p)" aria-label="pink"></button>
  <span class="small muted" data-t="hlHelp"></span>
  <button class="ib" id="hlDone" data-t="done"></button>
</div>

<div class="backdrop" id="exp"><div class="sheet">
  <h2 data-t="expT"></h2><p class="hint" style="margin-top:0" data-t="expHint"></p>
  <h3 data-t="lessons"></h3><div id="expLessons"></div>
  <h3 data-t="include"></h3>
  <label class="opt"><input type="checkbox" id="incF" checked> <span data-t="incF"></span></label>
  <label class="opt"><input type="checkbox" id="incS" checked> <span data-t="incS"></span></label>
  <label class="opt"><input type="checkbox" id="incR" checked> <span data-t="incR"></span></label>
  <label class="opt"><input type="checkbox" id="incH" checked> <span data-t="incH"></span></label>
  <label class="opt"><input type="checkbox" id="incN" checked> <span data-t="incN"></span></label>
  <label class="opt"><input type="checkbox" id="incW" checked> <span data-t="incW"></span></label>
  <h3 data-t="size"></h3>
  <div class="seg" id="sizeSeg"><button data-s="phone" class="on" data-t="phone"></button><button data-s="a4">📄 A4</button></div>
  <div class="row"><button class="btn" id="doPdf" style="flex:1" data-t="create"></button><button class="btn ghost" data-close="exp" data-t="close"></button></div>
</div></div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="print"></div>
</body>
</html>
